function status(q){const r=review(q);if(r.validity==='invalid')return 'invalid';if(r.validity==='pending')return 'pending';if(r.adoption==='adopted'&&r.verification==='matched')return 'verified';if(r.adoption==='adopted')return 'adopted';return 'valid';}
function flatten(){return state.records.flatMap(record=>(record.questions||[]).map((q,index)=>({record,q,index,key:JSON.stringify([record.id,q.id])})));}
function filtered(){const f=state.filter;return flatten().filter(row=>{const {record:r,q}=row;const phone=safePhone(r)||'';if(state.tab!=='all'&&(state.tab==='adopted'?!['adopted','verified'].includes(status(q)):status(q)!==state.tab))return false;if(f.keyword&&!`${r.id} ${q.id} ${q.stem} ${phone}`.toLowerCase().includes(f.keyword.toLowerCase()))return false;if(f.subject&&q.subject!==f.subject)return false;if(f.province&&q.province!==f.province)return false;if(f.type&&q.type!==f.type)return false;const day=Number.isFinite(new Date(r.createdAt).getTime())?new Date(r.createdAt).toLocaleDateString('sv-SE'):'';return !(f.start&&(!day||day<f.start))&&!(f.end&&(!day||day>f.end));});}
function opts(values,current,placeholder){return `<option value="">${placeholder}</option>`+values.map(v=>{const [value,name]=Array.isArray(v)?v:[v,v];return `<option value="${esc(value)}" ${value===current?'selected':''}>${esc(name)}</option>`}).join('');}
function read(){state.readError='';try{const value=JSON.parse(localStorage.getItem(state.sample?CONFIG.sampleKey:CONFIG.storageKey)||'[]');if(!Array.isArray(value))throw new Error('记录格式异常');state.records=value.filter(r=>r&&typeof r.id==='string'&&Array.isArray(r.questions)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));}catch(e){state.records=[];state.readError='浏览器数据读取失败，未覆盖原始记录。请检查存储权限或导入备份。';}state.selected.clear();}
function render(){const all=flatten(),rows=filtered(),counts=Object.fromEntries(Object.keys(LABELS).map(s=>[s,all.filter(r=>s==='adopted'?['adopted','verified'].includes(status(r.q)):status(r.q)===s).length]));const totalPages=Math.max(1,Math.ceil(rows.length/state.pageSize));state.page=Math.min(state.page,totalPages);const pageRows=rows.slice((state.page-1)*state.pageSize,state.page*state.pageSize);const authorized=state.records.filter(safePhone).length;
$('#main').innerHTML=`<div class="page-heading"><div><div class="heading-top"><h1>回忆题投稿管理</h1><span class="activity-pill">2026年10月考后专场</span></div><p class="page-description">统一查看考生回忆内容，跟进有效性审核与后续核验。</p></div><div class="actions"><button class="btn" data-action="import">${icon('up')}导入记录</button><button class="btn" data-action="export">${icon('down')}导出记录</button><a class="btn blue" href="${esc(CONFIG.h5Url)}" target="_blank" rel="noopener">${icon('out')}打开H5活动</a></div></div><div class="source-strip ${state.sample?'sample':''}"><div class="source-left">${icon('info')}<span>${state.readError|| (state.sample?'当前查看体验数据，与H5投稿记录相互独立。':'当前数据源：本地浏览器 · 同一浏览器打开H5并投稿，记录会自动同步至此。')}</span></div><button class="source-link" data-action="${state.sample?'live':'guide'}">${state.sample?'切换投稿记录 →':'联动说明 →'}</button></div><div class="stats"><button class="stat" data-action="stat" data-tab="all"><span class="stat-icon">${icon('list')}</span><div class="stat-label">投稿题目总数</div><div class="stat-number">${all.length}<small>道</small></div><div class="stat-foot">来自 ${state.records.length} 次投稿</div></button><button class="stat" data-action="stat" data-tab="pending"><span class="stat-icon">${icon('clock')}</span><div class="stat-label">待审核题目</div><div class="stat-number">${counts.pending}<small>道</small></div><div class="stat-foot">等待确认题目有效性</div></button><button class="stat" data-action="stat" data-tab="adopted"><span class="stat-icon">${icon('check')}</span><div class="stat-label">已采纳题目</div><div class="stat-number">${counts.adopted}<small>道</small></div><div class="stat-foot">其中 ${counts.verified} 道已完成核验匹配</div></button><button class="stat" data-action="authorized"><span class="stat-icon">${icon('phone')}</span><div class="stat-label">已授权手机号码</div><div class="stat-number">${authorized}<small>次投稿</small></div><div class="stat-foot">联系方式默认脱敏展示</div></button></div><section class="panel"><div class="panel-head"><div class="panel-title">${icon('grid')}投稿记录<span class="count">${all.length} 道</span></div><div class="actions"><span class="refresh-caption">${state.sample?'体验数据':'本机数据'}</span><button class="btn" data-action="refresh">${icon('refresh')}刷新</button></div></div><div class="tabs" role="tablist" aria-label="审核状态筛选">${[['all','全部'],...Object.entries(LABELS)].map(([key,label])=>`<button class="tab ${state.tab===key?'active':''}" role="tab" aria-selected="${state.tab===key}" data-action="tab" data-tab="${key}">${label}<b>${key==='all'?all.length:counts[key]}</b></button>`).join('')}</div><form id="filters"><div class="filters"><div class="filter-field"><label for="keyword">关键词搜索</label><input class="control" id="keyword" name="keyword" value="${esc(state.filter.keyword)}" placeholder="题干、完整手机号或投稿编号"></div><div class="filter-field"><label for="province">考试省份</label><select class="control" id="province" name="province">${opts(CONFIG.provinces,state.filter.province,'全部省份')}</select></div><div class="filter-field"><label for="subject">考试科目</label><select class="control" id="subject" name="subject">${opts(Object.entries(CONFIG.subjects),state.filter.subject,'全部科目')}</select></div><div class="filter-field"><label for="type">题型</label><select class="control" id="type" name="type">${opts(CONFIG.types,state.filter.type,'全部题型')}</select></div><div class="actions filter-buttons"><button type="submit" class="btn blue">查询</button><button type="button" class="btn" data-action="reset">重置</button></div></div><div class="date-filters"><label for="start">投稿时间</label><input class="control" type="date" id="start" name="start" value="${state.filter.start}"><span>至</span><input class="control" type="date" id="end" name="end" value="${state.filter.end}"><span class="filter-status">共筛选出 ${rows.length} 道回忆题</span></div></form><div class="table-toolbar"><div class="bulk-actions"><span>已选 <b>${state.selected.size}</b> 项</span><button class="link-btn" data-action="bulk-valid" ${state.selected.size?'':'disabled'}>标记有效</button><button class="link-btn" data-action="bulk-invalid" ${state.selected.size?'':'disabled'}>标记无效</button></div><span>一行一道题 · 多道题关联同一次投稿</span></div><div class="table-wrap"><table aria-label="回忆题投稿记录"><colgroup><col style="width:45px"><col style="width:25%"><col style="width:13%"><col style="width:13%"><col style="width:12%"><col style="width:13%"><col style="width:10%"><col style="width:90px"></colgroup><thead><tr><th><input type="checkbox" id="select-all" aria-label="选择本页全部题目" ${pageRows.length&&pageRows.every(r=>state.selected.has(r.key))?'checked':''} ${pageRows.length?'':'disabled'}></th><th>回忆题内容 / 投稿编号</th><th>联系方式</th><th>科目 / 省份</th><th>审核状态</th><th>投稿时间</th><th>图片 / 记忆程度</th><th>操作</th></tr></thead><tbody>${pageRows.map(rowHTML).join('')}</tbody></table>${!rows.length?`<div class="empty"><div class="empty-icon">${icon('list')}</div><h3>${all.length?'暂无符合条件的投稿':'还没有回忆题投稿记录'}</h3><p>${all.length?'试试其他筛选条件，或重置查看全部。':'在同一浏览器打开H5活动并完成投稿，<br>题目与已授权的手机号将在这里显示。'}</p><button class="btn ${all.length?'':'blue'}" data-action="${all.length?'reset':'samples'}">${all.length?'重置筛选':'载入体验数据'}</button>${all.length?'':`<button class="btn" data-action="guide" style="margin-left:7px">查看联动方式</button>`}</div>`:''}</div><div class="pagination"><span>共 ${rows.length} 条记录 · 当前第 ${state.page} / ${totalPages} 页</span><div class="page-controls"><select class="page-size" id="page-size" aria-label="每页条数">${CONFIG.pageSizes.map(n=>`<option value="${n}" ${n===state.pageSize?'selected':''}>${n}条 / 页</option>`).join('')}</select><button class="page-btn" data-action="prev" aria-label="上一页" ${state.page===1?'disabled':''}>‹</button><span class="page-btn current">${state.page}</span><button class="page-btn" data-action="next" aria-label="下一页" ${state.page===totalPages?'disabled':''}>›</button></div></div></section><p class="footer">自考过啦 · 考后活动运营工作台　/　当前为本地联动，跨设备数据汇总需接入后台服务</p>`;
}
function rowHTML(row){const {record:r,q,index,key}=row,s=status(q);return `<tr><td><input type="checkbox" data-row="${esc(key)}" aria-label="选择题目 ${esc(q.id)}" ${state.selected.has(key)?'checked':''}></td><td><div class="question-name">${esc(q.stem)}</div><div class="question-id">${esc(r.id)} · 第 ${index+1} 题</div></td><td><div class="phone">${mask(safePhone(r))}</div><div class="subtext">${safePhone(r)?'已主动授权':'未提供奖励联系方式'}</div></td><td>${esc(CONFIG.subjects[q.subject]||q.subject)}<span class="type">${esc(q.type)}</span><div class="subtext">${esc(q.province)}</div></td><td><span class="tag ${s}">${LABELS[s]}</span><div class="subtext">${s==='verified'?'待对接进阶奖励发放':s==='valid'||s==='adopted'?'可进入基础奖励流程':s==='invalid'?'不满足基础奖励条件':'待确认题目有效性'}</div></td><td>${date(r.createdAt,true)}<div class="subtext">${new Date(r.createdAt).toLocaleTimeString('zh-CN',{hour12:false})}</div></td><td>${(q.images||[]).length} 张图片<div class="subtext">${esc(q.confidence||'未选择')}</div></td><td><div class="row-actions"><button class="link-btn" data-action="detail" data-key="${esc(key)}">查看详情</button><button class="link-btn" data-action="audit" data-key="${esc(key)}">${s==='pending'?'去审核':'修改审核'}</button></div></td></tr>`;}
function getRow(key){return flatten().find(row=>row.key===key);}
function openDetail(key){const row=getRow(key);if(!row)return toast('记录已更新，请刷新列表');drawerFocus=document.activeElement;state.detail=key;state.showPhone=false;state.reviewDraft={...review(row.q)};drawDetail();document.body.style.overflow='hidden';$('.drawer').focus();}
function drawDetail(){const row=getRow(state.detail);if(!row)return closeDetail();const {record:r,q,index}=row,rv=state.reviewDraft||review(q),s=status(q),p=safePhone(r);$('#layer').innerHTML=`<div class="overlay" id="drawer-overlay"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1"><header class="drawer-header"><div><h2 id="drawer-title">投稿详情 <span class="tag ${s}">${LABELS[s]}</span></h2><p>${esc(r.id)} · 第 ${index+1} / ${r.questions.length} 道题</p></div><button class="close-btn" data-action="close-detail" aria-label="关闭投稿详情">${icon('close')}</button></header><div class="drawer-body"><div class="detail-contact"><div><div class="caption">${icon('shield')}奖励联系方式</div><div class="big-phone">${p?(state.showPhone?p:mask(p)):'未授权提供'}</div><div class="consent">${p?'主动授权时间：'+date(r.consentedAt||r.createdAt):'该次投稿未提供手机号码；不得补填或推断号码。'}</div></div>${p?`<button class="btn" data-action="reveal">${icon('eye')}${state.showPhone?'隐藏号码':'查看完整号码'}</button>`:''}</div><section class="detail-section"><h3><span class="section-bar"></span>题目内容</h3><div class="meta-grid">${[['考试省份',q.province],['考试科目',CONFIG.subjects[q.subject]||q.subject],['题型',q.type],['题号',q.number||'未填写'],['记忆程度',q.confidence||'未选择'],['投稿时间',date(r.createdAt)]].map(([k,v])=>`<div class="meta-item"><div class="key">${k}</div><div class="value">${esc(v)}</div></div>`).join('')}</div><div class="detail-label">回忆题干</div><div class="question-body">${esc(q.stem)}</div><div class="detail-label">考生填写的答案 · 不代表参考答案</div><div class="question-body">${esc(q.answer||'未填写')}</div><div class="detail-label">上传图片（${(q.images||[]).length}张）</div>${q.images?.length?`<div class="images">${q.images.map((img,i)=>`<button class="image-btn" data-action="image" data-index="${i}" aria-label="预览投稿图片${i+1}"><img src="${esc(safeImage(img.data))}" alt="回忆题图片${i+1}"></button>`).join('')}</div>`:`<div class="subtext">未上传图片</div>`}</section><section class="detail-section" id="audit-section"><h3><span class="section-bar"></span>审核与采纳</h3><div class="review-grid"><div class="review-field"><label for="validity">有效性审核</label><select class="control" id="validity">${[['pending','待审核'],['valid','有效投稿'],['invalid','无效投稿']].map(([v,n])=>`<option value="${v}" ${rv.validity===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="review-field"><label for="adoption">题目采纳</label><select class="control" id="adoption" ${rv.validity!=='valid'?'disabled':''}>${[['pending','尚未采纳'],['adopted','采纳题目']].map(([v,n])=>`<option value="${v}" ${rv.adoption===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="review-field full"><label for="verification">后续完整真题核验</label><select class="control" id="verification" ${rv.validity!=='valid'||rv.adoption!=='adopted'?'disabled':''}>${[['pending','待核验'],['matched','已核验匹配']].map(([v,n])=>`<option value="${v}" ${rv.verification===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="review-field full"><label for="audit-note">审核备注${rv.validity==='invalid'?'（无效投稿必填）':'（选填）'}</label><textarea class="control" id="audit-note" maxlength="500" placeholder="记录整理情况、无效原因或后续核验依据…">${esc(rv.note)}</textarea><div id="review-error" class="validation" role="alert"></div></div></div><div class="info-note">${rv.validity==='invalid'?'无效投稿不满足基础奖励条件。':rv.validity==='valid'?'有效投稿可进入基础奖励流程；采纳且后续核验匹配后，方可进入进阶奖励流程。':'基础奖励须通过有效性审核。'} 审核状态只在本机保存，不会实际发放过啦豆、题库或课程权益。</div></section><section class="detail-section"><h3><span class="section-bar"></span>处理记录</h3><div class="history">${review(q).history.slice().reverse().map(h=>`<div class="history-row"><span class="history-dot"></span><div><strong>${esc(h.action)} · ${date(h.at)}</strong><p>${esc(h.note||'未填写备注')}</p></div></div>`).join('')}<div class="history-row"><span class="history-dot"></span><div><strong>收到回忆题投稿</strong><p>${date(r.createdAt)} · ${p?'用户已主动授权联系方式':'未提供联系方式'}</p></div></div></div></section></div><footer class="drawer-footer"><small>审核结果保存至当前浏览器</small><div class="actions"><button class="btn" data-action="close-detail">关闭</button><button class="btn blue" data-action="save-review">保存审核结果</button></div></footer></section></div>`;}
function safeImage(data){return typeof data==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(data)?data:'';}

function syncReviewDraft(){if(!state.detail)return;state.reviewDraft={...state.reviewDraft,validity:$('#validity').value,adoption:$('#adoption').value,verification:$('#verification').value,note:$('#audit-note').value};}
function saveReviews(keys,update){
 // 重新读最新存储，避免覆盖另一个H5标签刚刚提交的记录；仅修改当前选中题目的审核字段。
 try{const raw=JSON.parse(localStorage.getItem(state.sample?CONFIG.sampleKey:CONFIG.storageKey)||'[]');if(!Array.isArray(raw))throw new Error('记录格式异常');let changed=0;const now=new Date().toISOString();for(const r of raw){for(const q of r.questions||[]){const key=JSON.stringify([r.id,q.id]);if(!keys.includes(key))continue;const prev=review(q),next=update(prev);q.review={...next,updatedAt:now,history:[...prev.history,{at:now,action:next.validity==='invalid'?'标记无效投稿':next.verification==='matched'?'完成真题核验匹配':next.adoption==='adopted'?'采纳回忆题':next.validity==='valid'?'确认有效投稿':'恢复待审核',note:next.note}]};changed++;}}if(changed!==keys.length)throw new Error('部分题目已变更，请刷新后重试');localStorage.setItem(state.sample?CONFIG.sampleKey:CONFIG.storageKey,JSON.stringify(raw));read();render();return true;}catch(e){toast('保存失败：'+e.message+'。未覆盖已有记录。');return false;}}
function showModal(kind,payload={}){if(!state.modal)dialogFocus=document.activeElement;state.modal={kind,...payload};let html='';if(kind==='guide'){html=`<h2 id="modal-title">数据联动说明</h2><p>当前采用浏览器本地存储。只有同一浏览器、同一协议、域名与端口下的H5和PC管理页才能自动读取同一份投稿。</p><ul><li>从本页「打开H5活动」进入，完成投稿后返回此页；记录将自动刷新。</li><li>不同手机、不同电脑、不同浏览器之间不会自动同步。可通过JSON备份导入进行人工演示转移。</li><li>GitHub Pages不提供后台服务。本页没有真实登录、数据库或服务器端审核。</li><li>正式上线需接入登录权限、投稿存储、图片存储、服务端手机号校验和奖励状态接口。</li></ul><div class="guide-code">H5 → 本机投稿记录 → PC题目审核<br>题目 / 手机号码 / 授权时间 / 图片 / 处理记录</div><button class="btn blue" data-action="close-modal">我知道了</button>`;}else if(kind==='export'){html=`<h2 id="modal-title">导出投稿记录</h2><p>导出当前筛选结果（${filtered().length}道题）。CSV用于运营查看，JSON用于转移完整投稿记录。</p><div class="review-field"><label for="export-format">文件格式</label><select id="export-format" class="control"><option value="csv">CSV表格（默认手机号脱敏）</option><option value="json">JSON备份（含关联投稿的全部题目及图片）</option></select></div><label class="privacy-check"><input type="checkbox" id="export-full"><span>导出完整手机号码。我确认仅用于已授权的奖励联系，并妥善保管文件。JSON备份必须主动勾选此项；不会导出未授权号码。</span></label><div id="export-error" class="validation" role="alert"></div><button class="btn blue" data-action="confirm-export">${icon('down')}导出文件</button>`;}else if(kind==='bulk'){html=`<h2 id="modal-title">批量${payload.validity==='valid'?'标记有效':'标记无效'}</h2><p>将处理当前选中的 ${state.selected.size} 道题。此操作仅更新有效性，采纳与核验结果将保留（标记无效时会清除采纳及核验状态）。</p><div class="review-field"><label for="bulk-note">处理备注${payload.validity==='invalid'?'（必填）':'（选填）'}</label><textarea class="control" id="bulk-note" maxlength="500" placeholder="填写本次处理说明…"></textarea><div id="bulk-error" class="validation" role="alert"></div></div><button class="btn blue" data-action="confirm-bulk">确认处理</button>`;}else if(kind==='image'){html=`<h2 id="modal-title">投稿图片预览</h2><img class="modal-image" src="${esc(payload.data)}" alt="回忆题原图"><button class="btn" data-action="close-modal">关闭预览</button>`;}else if(kind==='import-summary'){html=`<h2 id="modal-title">确认导入记录</h2><p>已通过格式校验：${payload.records.length}次投稿，共${payload.records.reduce((n,r)=>n+r.questions.length,0)}道题。相同投稿编号会跳过，不覆盖本机记录或审核结果。</p><div class="info-note">仅导入已主动授权且格式有效的手机号码。数据仅保存在本机，不会上传GitHub或其他服务器。</div><button class="btn blue" data-action="confirm-import">确认导入到${state.sample?'体验数据':'投稿记录'}</button>`;}
$('#dialog-layer').innerHTML=`<div class="overlay modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><button class="close-btn" data-action="close-modal" aria-label="关闭弹窗">${icon('close')}</button>${html}</section></div>`;document.body.style.overflow='hidden';$('.modal').focus();}
function closeModal(){state.modal=null;$('#dialog-layer').innerHTML='';if(!state.detail)document.body.style.overflow='';if(dialogFocus?.isConnected)dialogFocus.focus({preventScroll:true});dialogFocus=null;}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportData(){const rows=filtered();if(!rows.length)return toast('当前没有可导出的记录');const format=$('#export-format').value,full=$('#export-full').checked;if(format==='json'&&!full){$('#export-error').textContent='完整备份包含联系方式，请先确认完整号码导出授权，或选择CSV脱敏导出。';return;}const suffix=new Date().toISOString().slice(0,10);if(format==='json'){const ids=new Set(rows.map(r=>r.record.id));const records=state.records.filter(r=>ids.has(r.id)).map(r=>({...r,phone:safePhone(r)}));download('回忆题投稿备份_'+suffix+'.json',JSON.stringify({format:'guola-recall-backup-v1',exportedAt:new Date().toISOString(),records},null,2),'application/json;charset=utf-8');}else{const headers=['投稿编号','题目编号','手机号','是否授权','授权时间','省份','科目','题型','题号','题干','考生答案','记忆程度','图片数量','投稿时间','有效性','采纳状态','核验状态','审核备注'];const lines=rows.map(({record:r,q})=>[r.id,q.id,full?safePhone(r)||'':mask(safePhone(r)),r.contactConsent?'是':'否',r.consentedAt||'',q.province,CONFIG.subjects[q.subject]||q.subject,q.type,q.number,q.stem,q.answer,q.confidence,(q.images||[]).length,date(r.createdAt),LABELS[status(q)],review(q).adoption==='adopted'?'已采纳':'尚未采纳',review(q).verification==='matched'?'核验匹配':'待核验',review(q).note]);download('回忆题投稿记录_'+suffix+'.csv','\uFEFF'+[headers,...lines].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}closeModal();toast('导出文件已生成');}
function validateImport(data){const records=Array.isArray(data)?data:data?.records;if(!Array.isArray(records)||!records.length||records.length>1000)throw new Error('文件需包含1至1000次投稿记录');const ids=new Set();return records.map((r,i)=>{const fail=m=>{throw new Error(`第${i+1}次投稿：${m}`);};if(!r||typeof r.id!=='string'||!r.id||r.id.length>100||ids.has(r.id))fail('编号缺失、重复或过长');ids.add(r.id);if(!r.createdAt||!Number.isFinite(new Date(r.createdAt).getTime()))fail('投稿时间无效');if(r.contactConsent===true&&!CONFIG.phonePattern.test(r.phone||''))fail('已授权手机号码格式无效');if(r.contactConsent===true&&(typeof r.consentedAt!=='string'||!Number.isFinite(new Date(r.consentedAt).getTime())))fail('缺少有效的主动授权时间');if(!Array.isArray(r.questions)||!r.questions.length||r.questions.length>100)fail('题目数量无效');const questionIds=new Set();const questions=r.questions.map((q,j)=>{if(!q||typeof q.id!=='string'||!q.id||q.id.length>100||questionIds.has(q.id))fail(`题目${j+1}编号无效或重复`);questionIds.add(q.id);if(!CONFIG.subjects[q.subject]||!CONFIG.types.includes(q.type)||typeof q.province!=='string'||!q.province.trim()||q.province.length>30||typeof q.stem!=='string'||!q.stem.trim()||q.stem.length>3000)fail(`题目${j+1}必填内容无效`);const imgs=q.images||[];if(!Array.isArray(imgs)||imgs.length>5||imgs.some(img=>!img||!safeImage(img.data)||img.data.length>4*1024*1024))fail(`题目${j+1}图片格式或数量无效`);const rv=review(q);if(rv.validity!=='valid'){rv.adoption='pending';rv.verification='pending';}if(rv.adoption!=='adopted')rv.verification='pending';return {id:q.id,province:q.province,subject:q.subject,type:q.type,number:String(q.number||'').slice(0,30),stem:q.stem.trim(),answer:String(q.answer||'').slice(0,2000),confidence:['很确定','大概记得','记不清'].includes(q.confidence)?q.confidence:'',images:imgs.map(img=>({name:String(img.name||'图片').slice(0,100),data:img.data})),review:{...rv,note:rv.note.slice(0,500),history:rv.history.filter(h=>h&&typeof h.action==='string'&&typeof h.at==='string').slice(-100).map(h=>({action:h.action.slice(0,80),at:h.at,note:String(h.note||'').slice(0,500)}))}};});return {id:r.id,createdAt:new Date(r.createdAt).toISOString(),isPrototype:true,status:'pending_review',rewardStatus:'待审核',contactConsent:r.contactConsent===true,consentedAt:r.contactConsent===true&&Number.isFinite(new Date(r.consentedAt).getTime())?r.consentedAt:r.contactConsent===true?r.createdAt:null,phone:r.contactConsent===true?r.phone:null,questions};});}
async function importFile(file){if(!file)return;if(file.size>50*1024*1024)return toast('备份文件不能超过50MB');try{const records=validateImport(JSON.parse(await file.text()));showModal('import-summary',{records});}catch(e){toast('导入失败：'+e.message);}$('#import-file').value='';}
function confirmImport(){try{const incoming=state.modal.records,key=state.sample?CONFIG.sampleKey:CONFIG.storageKey,current=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(current))throw new Error('本机存储格式异常');const ids=new Set(current.map(r=>r.id)),added=incoming.filter(r=>!ids.has(r.id));localStorage.setItem(key,JSON.stringify([...current,...added]));closeModal();read();state.page=1;render();toast(`已导入${added.length}次投稿，跳过${incoming.length-added.length}条重复记录`);}catch(e){toast('导入保存失败，未覆盖原始记录：'+e.message);}}
function loadSamples(){const now=Date.now();const question=(id,subject,type,stem,validity='pending',adoption='pending',verification='pending')=>({id,province:'广东省',subject,type,number:'',stem,answer:'',confidence:'大概记得',images:[],review:{validity,adoption,verification,note:'',history:[]}});const samples=[{id:'EXPERIENCE-001',createdAt:new Date(now-3600000).toISOString(),contactConsent:true,consentedAt:new Date(now-3600000).toISOString(),phone:'13800138000',questions:[question('EXP-Q01','management','单选','在团队工作安排中，哪项描述体现了计划职能？'),question('EXP-Q02','management','简答','请结合一个具体例子，说明有效沟通在团队协作中的作用。')]},{id:'EXPERIENCE-002',createdAt:new Date(now-7200000).toISOString(),contactConsent:true,consentedAt:new Date(now-7200000).toISOString(),phone:'13900000000',questions:[question('EXP-Q03','chinese','简答','简要说明景物描写如何表达情感。','valid','adopted'),question('EXP-Q04','chinese','论述','结合阅读经验，论述叙事视角对作品表达的影响。','valid','adopted','matched')]},{id:'EXPERIENCE-003',createdAt:new Date(now-10800000).toISOString(),contactConsent:false,consentedAt:null,phone:null,questions:[question('EXP-Q05','english','填空','根据上下文，用所给词的适当形式填空。','valid')]},{id:'EXPERIENCE-004',createdAt:new Date(now-14400000).toISOString(),contactConsent:false,consentedAt:null,phone:null,questions:[{...question('EXP-Q06','math','其他','只记得题目包含一个函数，其他内容暂时记不清。','invalid'),review:{validity:'invalid',adoption:'pending',verification:'pending',note:'题干信息不足，暂无法整理。',history:[]}}]}].map(r=>({...r,isPrototype:true,rewardStatus:'待审核'}));try{if(!localStorage.getItem(CONFIG.sampleKey))localStorage.setItem(CONFIG.sampleKey,JSON.stringify(samples));state.sample=true;state.tab='all';state.filter={keyword:'',province:'',subject:'',type:'',start:'',end:''};state.page=1;read();render();toast('已载入体验数据，不影响H5投稿记录');}catch(e){toast('浏览器存储不可用，未载入数据');}}
// ===== 所有界面操作与本地联动 =====
document.addEventListener('submit',event=>{if(event.target.id!=='filters')return;event.preventDefault();const f=new FormData(event.target);const filter=Object.fromEntries([...f].map(([k,v])=>[k,String(v).trim()]));if(filter.start&&filter.end&&filter.start>filter.end)return toast('开始日期不能晚于结束日期');state.filter=filter;state.page=1;state.selected.clear();render();});
document.addEventListener('input',event=>{if(event.target.id==='audit-note'&&state.reviewDraft)state.reviewDraft.note=event.target.value;});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='import-file'){importFile(el.files[0]);return;}if(el.id==='page-size'){state.pageSize=Number(el.value);state.page=1;state.selected.clear();render();return;}if(el.id==='select-all'){const pageRows=filtered().slice((state.page-1)*state.pageSize,state.page*state.pageSize);pageRows.forEach(row=>el.checked?state.selected.add(row.key):state.selected.delete(row.key));render();return;}if(el.dataset.row){el.checked?state.selected.add(el.dataset.row):state.selected.delete(el.dataset.row);render();return;}if(['validity','adoption','verification'].includes(el.id)){syncReviewDraft();if(state.reviewDraft.validity!=='valid'){state.reviewDraft.adoption='pending';state.reviewDraft.verification='pending';}if(state.reviewDraft.adoption!=='adopted')state.reviewDraft.verification='pending';const y=$('.drawer-body').scrollTop;drawDetail();$('.drawer-body').scrollTop=y;}});
document.addEventListener('click',event=>{if(event.target.classList.contains('modal-overlay'))return closeModal();if(event.target.id==='drawer-overlay'){if(!state.modal)closeDetail();return;}const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action;switch(action){case'all':case'reset':state.filter={keyword:'',province:'',subject:'',type:'',start:'',end:''};state.tab='all';state.page=1;state.selected.clear();render();break;case'tab':case'stat':state.tab=btn.dataset.tab;state.page=1;state.selected.clear();render();if(action==='stat')$('.panel').scrollIntoView({block:'start',behavior:'smooth'});break;case'authorized':toast(`${state.records.filter(safePhone).length}次投稿已授权号码；在详情中可按需查看完整号码`);break;case'refresh':read();render();toast('已重新读取本机投稿记录');break;case'guide':showModal('guide');break;case'samples':loadSamples();break;case'live':state.sample=false;state.tab='all';state.page=1;state.filter={keyword:'',province:'',subject:'',type:'',start:'',end:''};read();render();break;case'prev':state.page--;render();break;case'next':state.page++;render();break;case'detail':case'audit':openDetail(btn.dataset.key);if(action==='audit')$('#audit-section').scrollIntoView({block:'start'});break;case'close-detail':closeDetail();break;case'reveal':syncReviewDraft();state.showPhone=!state.showPhone;{const y=$('.drawer-body').scrollTop;drawDetail();$('.drawer-body').scrollTop=y;}break;case'image':{const q=getRow(state.detail)?.q,data=safeImage(q?.images?.[Number(btn.dataset.index)]?.data);if(data)showModal('image',{data});else toast('图片内容不可用');break;}case'save-review':{syncReviewDraft();const draft=state.reviewDraft;if(draft.validity==='invalid'&&!draft.note.trim()){$('#review-error').textContent='标记无效时请填写原因';$('#audit-note').focus();break;}if(saveReviews([state.detail],()=>({...draft,note:draft.note.trim()}))){closeDetail();toast('审核结果已保存，未实际发放奖励');}break;}case'bulk-valid':case'bulk-invalid':showModal('bulk',{validity:action==='bulk-valid'?'valid':'invalid'});break;case'confirm-bulk':{const note=$('#bulk-note').value.trim(),validity=state.modal.validity;if(validity==='invalid'&&!note){$('#bulk-error').textContent='请填写无效原因';break;}if(saveReviews([...state.selected],prev=>({...prev,validity,note:note||prev.note,adoption:validity==='invalid'?'pending':prev.adoption,verification:validity==='invalid'?'pending':prev.verification}))){closeModal();toast('批量处理已保存');}break;}case'close-modal':closeModal();break;case'export':if(filtered().length)showModal('export');else toast('当前没有可导出的记录');break;case'confirm-export':exportData();break;case'import':$('#import-file').click();break;case'confirm-import':confirmImport();break;}});
document.addEventListener('keydown',event=>{const dialog=state.modal?$('.modal'):state.detail?$('.drawer'):null;if(!dialog)return;if(event.key==='Escape'){state.modal?closeModal():closeDetail();event.preventDefault();return;}if(event.key==='Tab'){const items=[...dialog.querySelectorAll('button,input,select,textarea,a[href]')].filter(e=>!e.disabled&&e.getClientRects().length);const first=items[0],last=items[items.length-1];if(event.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
window.addEventListener('storage',event=>{if(event.key!==(state.sample?CONFIG.sampleKey:CONFIG.storageKey))return;if(state.detail||state.modal){toast('另一个页面更新了记录，关闭详情后刷新可查看');return;}read();render();toast('收到H5投稿更新，列表已刷新');});
window.addEventListener('focus',()=>{if(!state.detail&&!state.modal){read();render();}});
read();render();
</script>
</body></html>
