 return `<div class="editor"><div class="editor-head"><span class="editor-title">${icon('file')} 第 ${state.active+1} 道回忆题</span><button type="button" class="delete-question" data-action="delete-question">${icon('trash')}删除此题</button></div><div class="field-row"><div class="field"><label for="province"><span class="required">*</span>考试省份</label><select id="province" data-field="province" class="control ${invalid('province')}">${options(CONFIG.provinces,q.province,'请选择省份')}</select>${fieldError('province')}</div><div class="field"><label for="subject"><span class="required">*</span>考试科目</label><select id="subject" data-field="subject" class="control ${invalid('subject')}">${options(CONFIG.subjects.slice(1),q.subject,'请选择科目')}</select>${fieldError('subject')}</div></div><div class="field"><label for="type"><span class="required">*</span>题型</label><select id="type" data-field="type" class="control ${invalid('type')}">${options(CONFIG.types,q.type,'请选择题型')}</select>${fieldError('type')}</div><div class="field"><label for="number">题号<span class="optional">选填，记不清可跳过</span></label><input id="number" class="control" data-field="number" value="${esc(q.number)}" maxlength="30" placeholder="例如：第 8 题"></div><div class="field"><label for="stem"><span class="required">*</span>回忆题干</label><textarea id="stem" data-field="stem" class="control ${invalid('stem')}" maxlength="3000" placeholder="尽可能写下你记得的题干、选项或关键词…">${esc(q.stem)}</textarea><div class="char-count" id="stem-count">${q.stem.length} / 3000</div>${fieldError('stem')}</div><div class="field"><label for="answer">我的答案<span class="optional">选填，仅记录你的作答</span></label><textarea id="answer" data-field="answer" class="control answer" maxlength="2000" placeholder="你当时的答案或解题思路…">${esc(q.answer)}</textarea></div><fieldset class="field" style="padding:0;border:0;margin-left:0;margin-right:0"><legend class="field-legend">记忆程度<span class="optional">选填</span></legend><div class="choice-group">${CONFIG.confidence.map(c=>`<label class="choice"><input type="radio" name="confidence" data-field="confidence" value="${c}" ${q.confidence===c?'checked':''}><span>${c}</span></label>`).join('')}</div></fieldset><div class="field"><div class="field-legend">上传图片<span class="optional">选填，最多${CONFIG.upload.maxCount}张</span></div><div class="upload-grid">${q.images.map((img,i)=>`<div class="thumb"><button type="button" class="image-open" data-action="preview" data-index="${i}" aria-label="预览图片${i+1}"><img src="${esc(img.data)}" alt="回忆题图片${i+1}"></button><button type="button" class="image-delete" data-action="delete-image" data-index="${i}" aria-label="删除图片${i+1}">×</button></div>`).join('')}${q.images.length<CONFIG.upload.maxCount?`<button type="button" class="upload-box" data-action="upload" ${state.uploading?'disabled':''}>${icon('plus')}<span>${state.uploading?'处理中…':'添加图片'}</span></button>`:''}</div><input type="file" id="image-input" accept="image/jpeg,image/png,image/webp" multiple hidden><p class="upload-tip">JPG / PNG / WebP，单张不超过8MB。仅在本机读取并压缩保存；请勿上传身份证等敏感信息。</p><div class="loading-message" id="image-status" role="status"></div></div></div>`;
}
function renderForm(){return `<section class="view">${nav('上传回忆题','leave-form','分享记忆 · 一起补全')}<div class="page-content form-content"><h1>上传你记得的考题</h1><p class="subtitle">还记得刚考过的题目吗？<br>分享你的回忆，帮助更多考生！</p><div class="notice">${icon('info')}<span>内容仅保存在当前浏览器，暂不上传服务器。<br>提交后不代表审核通过或奖励发放。</span></div><div class="question-tabs" aria-label="选择编辑题目">${state.questions.map((q,i)=>`<button type="button" class="q-tab ${i===state.active?'active':''}" data-action="select-question" data-index="${i}" aria-pressed="${i===state.active}">第 ${i+1} 题${q.stem.trim()?' · 已填写':''}</button>`).join('')}<button type="button" class="q-tab tab-add" data-action="add-question" aria-label="添加一道题">＋</button></div><div id="editor-area">${renderEditor()}</div><button type="button" class="add-question" data-action="add-question">＋ 再回忆一道题</button><section class="contact"><div class="contact-heading"><h3>奖励联系方式</h3><span class="optional">自愿授权</span></div><p class="explain">手机号码用于联系领取过啦豆及后续奖励。手机号码仅保存在当前浏览器。不授权也可提交回忆题。</p><label class="check-label"><input type="checkbox" id="phone-consent" ${state.consent?'checked':''}><span>我同意为领取过啦豆及后续奖励，提供并保存手机号码作为联系方式。</span></label><div class="field" id="phone-area" ${state.consent?'':'hidden'}><label for="phone">手机号码<span class="optional">授权后请填写</span></label><input id="phone" class="control ${invalid('phone')}" value="${esc(state.phone)}" type="tel" inputmode="numeric" autocomplete="tel" minlength="11" maxlength="11" pattern="1[3-9][0-9]{9}" placeholder="请输入11位手机号码"><p class="upload-tip">请输入11位中国大陆手机号码，第二位为3–9。</p>${fieldError('phone')}</div></section><p class="form-policy">提交后进入「待审核」状态。基础奖励在有效性审核通过后领取；进阶奖励另需采纳及后续真题核验匹配。${CONFIG.rewards.pending}</p></div><div class="fixed-action"><div class="action-caption"><span>已添加 <b>${state.questions.length}</b> 道 · 最少1道有效题</span><span>带 * 项为必填</span></div><button type="button" class="primary" data-action="submit" ${state.busy?'disabled':''}>${state.busy?'正在提交…':'提交回忆题'}${icon('arrow')}</button><div class="progress" id="submit-progress" role="progressbar" aria-label="提交进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><span></span></div></div></section>`;}
function renderDetail(){const q=CONFIG.questions.find(q=>q.id===state.detailId&&q.status==='published'&&q.publicVisible);if(!q)return `${nav('回忆题详情')}<div class="page-content"><div class="empty"><h3>该题目暂不可查看</h3><p>题目可能正在整理或未开放展示。</p><button type="button" data-action="home">返回活动首页</button></div></div>`;return `<section class="view">${nav('回忆题详情','home','运营整理')}<div class="page-content"><div class="detail-summary"><span class="badge">${subjectName(q.subject)}</span><span class="badge neutral">${q.type}</span></div><h1>一起补全考后的记忆</h1><p class="subtitle">回忆题 ${q.order} · 内容根据运营收集整理展示</p><article class="detail-card"><div class="detail-label">QUESTION / 题目内容</div><p class="detail-stem">${esc(q.stem)}</p>${q.options?.length?`<div class="options">${q.options.map((o,i)=>`<div class="option"><b>${String.fromCharCode(65+i)}</b><span>${esc(o)}</span></div>`).join('')}</div>`:''}<div class="detail-source"><div class="detail-status"><span class="dot"></span>${esc(q.organization)}</div>内容来源：${esc(q.source)}</div></article><div class="notice">${icon('info')}<span>${q.answer?esc(q.answer):'暂未配置可公开的参考答案。可进群交流回忆与解题思路，整理内容以运营后续发布为准。'}</span></div><div class="detail-actions"><button type="button" class="primary" data-action="qr">${icon('chat')}扫码进群查看更多</button><button type="button" class="secondary" data-action="recall-detail">我也记得这道题 ${icon('arrow')}</button></div><p class="micro" style="margin-top:15px">分享你自己的回忆，让更多记忆拼在一起。</p></div></section>`;}
function renderSuccess(){const s=state.lastSubmission;if(!s)return `${nav('投稿状态')}<div class="page-content"><div class="empty"><h3>暂无本次投稿记录</h3><p>先分享一道你记得的题吧。</p><button type="button" data-action="start-form">去上传回忆题</button></div></div>`;return `<section class="view">${nav('投稿成功','home','分享记忆 · 一起补全')}<div class="page-content success-content"><div class="success-visual"><span class="spark"></span><span class="spark two"></span><span class="spark three"></span><div class="success-circle">${icon('check')}</div></div><h1>回忆题提交成功！</h1><p class="subtitle">感谢你的分享！运营人员将在后续<br>对题目进行整理与审核。</p><div class="receipt"><div class="receipt-top"><div><span class="num">${s.questions.length}</span><span class="unit">道回忆题 · 本次提交</span></div><span class="pending">${esc(s.rewardStatus)}</span></div><div class="receipt-row"><h3>${icon('shield')}基础奖励 · 有效性审核后领取</h3><p>${CONFIG.rewards.base}<br>当前尚未通过审核，奖励尚未发放。</p></div><div class="receipt-row"><h3 class="gold">✦ 进阶奖励 · 采纳并核验后领取</h3><p>优质回忆题需被采纳，并在完整真题整理后核验匹配，方可获得题库任选学科30天免费刷题权益、额外过啦豆及课程/真题资料奖励。</p></div><div class="receipt-row"><p>${CONFIG.rewards.pending}<br>${s.contactConsent?'已按你的主动授权，将奖励联系方式保存在当前浏览器。':'未提供手机号码，投稿已保留。正式奖励联系与领取方式待业务确认。'}</p></div></div><div class="notice">${icon('info')}<span>记录仅保存在当前浏览器，暂未上传服务器。<br>提交不代表审核通过或奖励到账。</span></div><div class="success-actions"><button type="button" class="primary" data-action="continue">继续上传回忆题 ${icon('arrow')}</button><button type="button" class="secondary" data-action="qr">${icon('chat')}扫码加入考后交流群</button><button type="button" class="home-link" data-action="home">返回活动首页</button></div><p class="success-id">本地记录编号 ${esc(s.id)}</p></div></section>`;}
/* ===== 页面导航与视图渲染 ===== */
function render(){const renderers={home:renderHome,form:renderForm,detail:renderDetail,success:renderSuccess};$('#app').innerHTML=renderers[state.view]();document.title=({home:'考后真题回忆',form:'上传回忆题',detail:'回忆题详情',success:'回忆题提交成功'}[state.view])+' · 自考过啦';}
function routeHash(){return state.view==='detail'?'#detail/'+encodeURIComponent(state.detailId):'#'+state.view;}
function go(view,replace=false){closeModal();state.view=view;const hash=routeHash();if(location.hash!==hash){history[replace?'replaceState':'pushState']({view},'',hash);}render();window.scrollTo(0,0);}
function startForm(subject=state.filter,fromDetail=false){
 if(!state.questions.length){state.questions=[newQuestion(subject)];state.active=0;}
 else if(subject&&subject!=='all'){
   const current=state.questions[state.active];
   if(fromDetail&&current.subject!==subject&&(current.stem.trim()||current.images.length)){
     const next=newQuestion(subject);next.province=current.province;
     state.questions.push(next);state.active=state.questions.length-1;
   }else if(fromDetail||!current.subject){current.subject=subject;}
 }
 state.errors={};go('form');
}
function refreshEditor(){const y=window.scrollY;render();window.scrollTo(0,y);}
/* ===== 弹窗：二维码、规则、图片预览、删除与离开确认 ===== */
function openModal(kind,payload={}){closeModal();modalFocus=document.activeElement;scrollBeforeModal=window.scrollY;state.modal={kind,...payload};let body='';
 if(kind==='qr'){body=`<div class="modal-icon">${icon('chat')}</div><h2 id="modal-title">${CONFIG.group.title}</h2><p class="modal-desc">${CONFIG.group.description}</p><div class="qr-box" id="qr-box">${CONFIG.group.qrImage?`<img id="group-qr" src="${esc(CONFIG.group.qrImage)}" alt="考后真题交流群二维码">`:qrPlaceholder()}</div><p class="qr-tip">${CONFIG.group.qrImage?'长按二维码保存图片，在微信中识别入群。':'微信群二维码待配置，当前无法扫码入群。'}</p><button type="button" class="primary" data-action="close-modal">${CONFIG.group.qrImage?'我知道了':'知道了，期待一起交流'}</button><p class="modal-note">${CONFIG.group.qrImage?'如二维码失效，请联系活动运营人员。':'正式活动上线后，由运营配置真实微信群二维码。'}</p>`;}
 else if(kind==='rules'){body=`<div class="modal-icon">${icon('info')}</div><h2 id="modal-title">活动与奖励说明</h2><ol class="modal-list"><li>首页题目由运营配置，题目内容及公开范围以运营后续确认为准。</li><li>提交回忆题后须经过有效性审核，审核通过后领取基础奖励。</li><li>优质题目被采纳且在完整真题整理后核验匹配，才可获得进阶奖励。</li><li>${CONFIG.rewards.pending}</li><li>当前内容仅保存在浏览器，不上传服务器，不进行审核或奖励发放。手机号码仅在主动授权后随投稿保存在当前浏览器。清除浏览器数据会删除本地记录。</li></ol><button type="button" class="primary" data-action="close-modal">我知道了</button>`;}
 else if(kind==='preview'){body=`<h2 id="modal-title">图片预览</h2><img class="preview-image" src="${esc(payload.data)}" alt="回忆题上传图片预览"><button type="button" class="secondary" data-action="close-modal">关闭预览</button>`;}
 else if(kind==='delete'){body=`<div class="modal-icon">${icon('trash')}</div><h2 id="modal-title">删除这道回忆题？</h2><p class="modal-desc">这道题的文字和图片将从当前草稿移除。至少保留一道题，删除最后一道时会重置为空白题。</p><button type="button" class="primary" data-action="confirm-delete">确认删除</button><button type="button" class="home-link" data-action="close-modal">保留并继续编辑</button>`;}
 else if(kind==='leave'){body=`<h2 id="modal-title">返回活动首页？</h2><p class="modal-desc">草稿会在当前页面会话中保留，可以继续编辑。刷新或关闭页面后，未提交草稿将丢失。</p><button type="button" class="primary" data-action="confirm-leave">保留草稿，返回首页</button><button type="button" class="home-link" data-action="close-modal">继续填写</button>`;}
 $('#modal-root').innerHTML=`<div class="modal-layer"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><button type="button" class="modal-close" data-action="close-modal" aria-label="关闭弹窗">${icon('close')}</button>${body}</section></div>`;document.body.style.overflow='hidden';$('.modal').focus();
 const qr=$('#group-qr');if(qr)qr.addEventListener('error',()=>{$('#qr-box').innerHTML=qrPlaceholder();$('.qr-tip').textContent='微信群二维码加载失败，请联系运营更换配置。';$('.modal-note').textContent='当前无法入群，请稍后重试。';});
}
function qrPlaceholder(){return `<div class="qr-placeholder">${icon('chat')}<strong>微信群二维码待配置</strong><small>此区域不含可扫描二维码</small></div>`;}
function closeModal(){if(!state.modal)return;state.modal=null;$('#modal-root').innerHTML='';document.body.style.overflow='';if(modalFocus?.isConnected)modalFocus.focus({preventScroll:true});modalFocus=null;}
function clearFieldError(target,key){target.classList.remove('error-control');target.removeAttribute('aria-invalid');target.removeAttribute('aria-describedby');delete state.errors[key];$('#error-'+key)?.remove();}
/* ===== 表单状态与控件事件委托 ===== */
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.field&&state.view==='form'){const q=state.questions[state.active];q[el.dataset.field]=el.value;clearFieldError(el,el.dataset.field);if(el.dataset.field==='stem')$('#stem-count').textContent=el.value.length+' / 3000';}if(el.id==='phone'){state.phone=el.value;clearFieldError(el,'phone');}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='subject-filter'){state.filter=el.value||'all';const y=window.scrollY;render();window.scrollTo(0,y);}else if(el.dataset.field&&state.view==='form'){state.questions[state.active][el.dataset.field]=el.value;clearFieldError(el,el.dataset.field);}else if(el.id==='phone-consent'){state.consent=el.checked;if(!el.checked){state.phone='';$('#phone').value='';clearFieldError($('#phone'),'phone');}$('#phone-area').hidden=!el.checked;}else if(el.id==='image-input'){handleImages(el.files);}});
document.addEventListener('click',event=>{if(event.target.classList.contains('modal-layer')){closeModal();return;}const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action;if(state.busy&&action!=='close-modal')return;if(state.uploading&&!['close-modal','preview'].includes(action)){toast('图片处理中，请稍候');return;}
 switch(action){case 'home':go('home');break;case 'reset-filter':state.filter='all';render();break;case 'detail':state.detailId=btn.dataset.id;go('detail');break;case 'qr':openModal('qr');break;case 'rules':openModal('rules');break;case 'close-modal':closeModal();break;case 'start-form':startForm();break;case 'recall-detail':{const q=CONFIG.questions.find(q=>q.id===state.detailId);startForm(q?.subject,true);toast('已带入当前科目，请填写你自己的回忆');break;}case 'select-question':state.active=Number(btn.dataset.index);state.errors={};refreshEditor();break;case 'add-question':{const prev=state.questions[state.active];const q=newQuestion(prev.subject);q.province=prev.province;state.questions.push(q);state.active=state.questions.length-1;state.errors={};refreshEditor();$('.question-tabs').scrollLeft=$('.question-tabs').scrollWidth;$('.editor').scrollIntoView({block:'start'});toast('已添加新题，省份与科目已沿用');break;}case 'delete-question':openModal('delete');break;case 'confirm-delete':state.questions.splice(state.active,1);if(!state.questions.length)state.questions=[newQuestion(state.filter)];state.active=Math.min(state.active,state.questions.length-1);state.errors={};closeModal();refreshEditor();toast('已删除，其他题目不受影响');break;case 'leave-form':openModal('leave');break;case 'confirm-leave':go('home');break;case 'upload':$('#image-input').click();break;case 'preview':openModal('preview',{data:state.questions[state.active].images[Number(btn.dataset.index)].data});break;case 'delete-image':state.questions[state.active].images.splice(Number(btn.dataset.index),1);refreshEditor();toast('图片已删除');break;case 'submit':submit();break;case 'continue':state.questions=[];state.active=0;state.phone='';state.consent=false;startForm();break;}
});
document.addEventListener('keydown',event=>{if(!state.modal)return;if(event.key==='Escape'){closeModal();event.preventDefault();return;}if(event.key==='Tab'){const items=[...$('.modal').querySelectorAll('button,input,select,textarea,a[href]')].filter(e=>!e.disabled&&!e.hidden);const first=items[0],last=items[items.length-1];if(event.shiftKey&&(document.activeElement===first||document.activeElement===$('.modal'))){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
// 授权后手机号在失焦时即时校验；提交时仍进行最终校验。
document.addEventListener('focusout',event=>{
  if(event.target.id!=='phone'||!state.consent)return;
  const input=event.target;
  state.phone=input.value.trim();input.value=state.phone;
  clearFieldError(input,'phone');
  if(!CONFIG.phonePattern.test(state.phone)){
    state.errors.phone='请输入有效的11位手机号码';
    input.classList.add('error-control');input.setAttribute('aria-invalid','true');
    input.setAttribute('aria-describedby','error-phone');
    const message=document.createElement('p');message.id='error-phone';message.className='error-message';
    message.textContent=state.errors.phone;input.parentElement.appendChild(message);
  }
});
/* ===== 本地图片读取、压缩与错误反馈 ===== */
function readImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('图片读取失败'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('图片格式无法读取，请选择 JPG、PNG 或 WebP'));img.onload=()=>{try{const scale=Math.min(1,CONFIG.upload.maxEdge/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve({name:file.name,data:canvas.toDataURL('image/jpeg',CONFIG.upload.quality)});}catch(e){reject(new Error('图片处理失败，请重试'));}};img.src=reader.result;};reader.readAsDataURL(file);});}
async function handleImages(files){if(!files?.length)return;const q=state.questions[state.active];const remaining=CONFIG.upload.maxCount-q.images.length;const selected=Array.from(files).slice(0,remaining);if(files.length>remaining)toast(`每道题最多${CONFIG.upload.maxCount}张，超出部分未添加`);state.uploading=true;const uploadButton=$('.upload-box');if(uploadButton)uploadButton.disabled=true;let added=0;const failures=[];try{for(let i=0;i<selected.length;i++){const f=selected[i];$('#image-status').textContent=`正在本地处理图片 ${i+1} / ${selected.length}…`;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){failures.push('仅支持 JPG / PNG / WebP');continue;}if(f.size>CONFIG.upload.maxBytes){failures.push('单张图片不能超过8MB');continue;}try{q.images.push(await readImage(f));added++;}catch(e){failures.push(e.message);}}}finally{state.uploading=false;refreshEditor();toast(failures.length?`${added?`已添加${added}张；`:''}${[...new Set(failures)].join('；')}`:`已添加${added}张图片，可点击预览`);}}
/* ===== 投稿校验与localStorage模拟持久化 ===== */
function validateQuestion(q){const errors={};if(!CONFIG.provinces.includes(q.province))errors.province='请选择考试省份';if(!CONFIG.subjects.slice(1).some(s=>s.id===q.subject))errors.subject='请选择考试科目';if(!CONFIG.types.includes(q.type))errors.type='请选择题型';if(!q.stem.trim())errors.stem='请填写回忆题干，至少分享你记得的内容';return errors;}
async function submit(){if(state.busy||state.uploading)return;for(let i=0;i<state.questions.length;i++){const errors=validateQuestion(state.questions[i]);if(Object.keys(errors).length){state.active=i;state.errors=errors;render();const first=$('.error-control');first?.focus();first?.scrollIntoView({block:'center',behavior:'smooth'});toast(`请补全第${i+1}道题的必填信息`);return;}}
 if(state.consent&&!CONFIG.phonePattern.test(state.phone.trim())){state.errors={phone:'请输入有效的11位手机号码，或取消授权后直接投稿'};render();$('#phone').focus();$('#phone').scrollIntoView({block:'center',behavior:'smooth'});toast('请检查奖励联系方式');return;}
 state.busy=true;const action=$('.fixed-action .primary');action.disabled=true;action.textContent='正在本地保存 · 0%';$('#submit-progress').hidden=false;
 try{for(const n of [25,65,90]){await new Promise(r=>setTimeout(r,220));action.textContent=`正在提交 · ${n}%`;$('#submit-progress').setAttribute('aria-valuenow',String(n));$('#submit-progress span').style.width=n+'%';}
  let records=[];const raw=localStorage.getItem(CONFIG.storageKey);if(raw){records=JSON.parse(raw);if(!Array.isArray(records))throw new Error('本地记录格式异常，未覆盖已有数据');}
  const record={id:'LOCAL-'+Date.now().toString(36).toUpperCase(),createdAt:new Date().toISOString(),isPrototype:true,status:'pending_review',rewardStatus:CONFIG.rewards.status,contactConsent:state.consent,consentedAt:state.consent?new Date().toISOString():null,phone:state.consent?state.phone.trim():null,questions:state.questions.map(q=>({...q,stem:q.stem.trim(),answer:q.answer.trim()}))};
  records.push(record);localStorage.setItem(CONFIG.storageKey,JSON.stringify(records));state.lastSubmission=record;$('#submit-progress span').style.width='100%';await new Promise(r=>setTimeout(r,150));state.questions=[];state.phone='';state.consent=false;state.active=0;state.busy=false;go('success');toast('提交完成，记录已保存在本机');
 }catch(error){state.busy=false;render();toast(error.name==='QuotaExceededError'?'本地空间不足，请删除部分题目图片后重试；草稿仍保留。':error.name==='SecurityError'?'当前浏览器禁止本地存储，请允许存储后重试；草稿仍保留。':'本地保存失败，草稿仍保留。请检查浏览器存储后重试。');}
}
function readRoute(){if(state.busy||state.uploading){history.pushState({},'',routeHash());toast('正在处理，请稍候');return;}closeModal();const hash=location.hash.slice(1);if(hash.startsWith('detail/')){state.detailId=decodeURIComponent(hash.slice(7));state.view='detail';}else if(hash==='form'){state.view='form';if(!state.questions.length){state.questions=[newQuestion(state.filter)];state.active=0;}}else if(hash==='success'){state.view='success';if(!state.lastSubmission){try{const records=JSON.parse(localStorage.getItem(CONFIG.storageKey)||'[]');state.lastSubmission=Array.isArray(records)?records[records.length-1]||null:null;}catch(e){state.lastSubmission=null;}}}else{state.view='home';}state.errors={};render();window.scrollTo(0,0);}
window.addEventListener('popstate',readRoute);
window.addEventListener('beforeunload',event=>{if(state.view==='form'&&state.questions.some(q=>q.stem.trim()||q.images.length)){event.preventDefault();event.returnValue='';}});
readRoute();
</script>
